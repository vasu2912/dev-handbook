<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Dev Handbook brand concepts</title>
  <desc id="desc">Three logo and color directions for Dev Handbook: Field Notes, System Map, and Clear Brackets.</desc>
  <defs>
    <style>
      .heading { font: 700 48px 'Space Grotesk', Inter, sans-serif; letter-spacing: -2px; fill: #172033; }
      .sub { font: 400 19px Inter, sans-serif; fill: #60708a; }
      .name { font: 700 27px 'Space Grotesk', Inter, sans-serif; letter-spacing: -1px; fill: #172033; }
      .body { font: 400 16px Inter, sans-serif; fill: #60708a; }
      .wordmark { font: 700 25px 'Space Grotesk', Inter, sans-serif; letter-spacing: -1px; fill: #172033; }
      .label { font: 600 13px Inter, sans-serif; letter-spacing: 1.3px; fill: #60708a; }
      .card { fill: #fff; stroke: #e1e7ef; stroke-width: 2; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#15356f" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1440" height="920" fill="#f8fafc"/>
  <circle cx="1220" cy="-10" r="310" fill="#dce9ff" opacity=".7"/>
  <text x="80" y="92" class="heading">Dev Handbook</text>
  <text x="80" y="128" class="sub">Three identity directions built for technical notes, diagrams, and long-form reading.</text>

  <!-- Concept 1 -->
  <g transform="translate(60 184)">
    <rect width="420" height="650" rx="26" class="card" filter="url(#shadow)"/>
    <text x="30" y="48" class="label">01  FIELD NOTES</text>
    <g transform="translate(30 78)">
      <rect width="360" height="188" rx="20" fill="#15356f"/>
      <g transform="translate(34 31)">
        <path d="M0 17C0 7.6 7.6 0 17 0h69c13.3 0 24 10.7 24 24v92c-8.3-8-18.7-12-31-12H17C7.6 104 0 96.4 0 87z" fill="#fff"/>
        <path d="M110 24c0-13.3 10.7-24 24-24h69c9.4 0 17 7.6 17 17v70c0 9.4-7.6 17-17 17h-62c-12.3 0-22.7 4-31 12z" fill="#dce9ff"/>
        <path d="M110 24v92" stroke="#83aefc" stroke-width="5" stroke-linecap="round"/>
        <path d="M28 31h50M28 50h58M28 69h42M142 31h50M142 50h42M142 69h58" stroke="#2459c7" stroke-width="6" stroke-linecap="round" opacity=".85"/>
      </g>
    </g>
    <text x="30" y="312" class="name">Field Notes</text>
    <text x="30" y="342" class="body">An open book with a strong center seam.</text>
    <text x="30" y="366" class="body">Direct, editorial, and unmistakably educational.</text>
    <g transform="translate(30 404)">
      <rect width="54" height="54" rx="14" fill="#15356f"/>
      <path d="M11 18c0-3.9 3.1-7 7-7h9c4.4 0 8 3.6 8 8v25c-2.8-2.7-6.2-4-10.3-4H18c-3.9 0-7-3.1-7-7z" fill="#fff"/>
      <path d="M35 19c0-4.4 3.6-8 8-8v29c-3.1 0-5.8 1.3-8 4z" fill="#dce9ff"/>
      <text x="72" y="35" class="wordmark">Dev Handbook</text>
    </g>
    <text x="30" y="508" class="label">PALETTE</text>
    <g transform="translate(30 528)">
      <circle cx="16" cy="16" r="16" fill="#15356f"/><circle cx="58" cy="16" r="16" fill="#2459c7"/>
      <circle cx="100" cy="16" r="16" fill="#83aefc"/><circle cx="142" cy="16" r="16" fill="#f8fafc" stroke="#e1e7ef"/>
    </g>
    <text x="30" y="610" class="body">Best fit: clear, trusted reference library.</text>
  </g>

  <!-- Concept 2 -->
  <g transform="translate(510 184)">
    <rect width="420" height="650" rx="26" class="card" filter="url(#shadow)"/>
    <text x="30" y="48" class="label">02  SYSTEM MAP</text>
    <g transform="translate(30 78)">
      <rect width="360" height="188" rx="20" fill="#111827"/>
      <g transform="translate(74 25)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M106 10 22 48v62l84 38 84-38V48z" stroke="#60a5fa" stroke-width="7"/>
        <path d="M22 48l84 38 84-38M106 86v62" stroke="#a78bfa" stroke-width="7"/>
        <circle cx="106" cy="10" r="10" fill="#f8fafc" stroke="none"/><circle cx="22" cy="48" r="10" fill="#f8fafc" stroke="none"/>
        <circle cx="190" cy="48" r="10" fill="#f8fafc" stroke="none"/><circle cx="106" cy="86" r="10" fill="#f8fafc" stroke="none"/>
        <circle cx="22" cy="110" r="10" fill="#f8fafc" stroke="none"/><circle cx="190" cy="110" r="10" fill="#f8fafc" stroke="none"/>
        <circle cx="106" cy="148" r="10" fill="#f8fafc" stroke="none"/>
      </g>
    </g>
    <text x="30" y="312" class="name">System Map</text>
    <text x="30" y="342" class="body">Connected nodes form a compact isometric system.</text>
    <text x="30" y="366" class="body">More technical, with a subtle infrastructure feel.</text>
    <g transform="translate(30 404)">
      <rect width="54" height="54" rx="14" fill="#111827"/>
      <g transform="translate(11 10) scale(.15)" fill="none" stroke="#83aefc" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M106 10 22 48v62l84 38 84-38V48zM22 48l84 38 84-38M106 86v62"/>
      </g>
      <text x="72" y="35" class="wordmark">Dev Handbook</text>
    </g>
    <text x="30" y="508" class="label">PALETTE</text>
    <g transform="translate(30 528)">
      <circle cx="16" cy="16" r="16" fill="#111827"/><circle cx="58" cy="16" r="16" fill="#2563eb"/>
      <circle cx="100" cy="16" r="16" fill="#7c3aed"/><circle cx="142" cy="16" r="16" fill="#f8fafc" stroke="#e1e7ef"/>
    </g>
    <text x="30" y="610" class="body">Best fit: system design as the main identity.</text>
  </g>

  <!-- Concept 3 -->
  <g transform="translate(960 184)">
    <rect width="420" height="650" rx="26" class="card" filter="url(#shadow)"/>
    <text x="30" y="48" class="label">03  CLEAR BRACKETS</text>
    <g transform="translate(30 78)">
      <rect width="360" height="188" rx="20" fill="#dce9ff"/>
      <g transform="translate(76 27)" fill="none" stroke="#2459c7" stroke-width="15" stroke-linecap="square" stroke-linejoin="round">
        <path d="M54 4H15v130h39"/>
        <path d="M154 4h39v130h-39"/>
        <path d="M73 23v92M135 23v92M74 68h60"/>
      </g>
    </g>
    <text x="30" y="312" class="name">Clear Brackets</text>
    <text x="30" y="342" class="body">A compact H held inside code-like brackets.</text>
    <text x="30" y="366" class="body">Sharp at small sizes and easy to recognize.</text>
    <g transform="translate(30 404)">
      <rect width="54" height="54" rx="14" fill="#dce9ff"/>
      <g transform="translate(12 10)" fill="none" stroke="#2459c7" stroke-width="4" stroke-linecap="square">
        <path d="M8 0H0v34h8M22 0h8v34h-8M12 6v22M18 6v22M12 17h6"/>
      </g>
      <text x="72" y="35" class="wordmark">Dev Handbook</text>
    </g>
    <text x="30" y="508" class="label">PALETTE</text>
    <g transform="translate(30 528)">
      <circle cx="16" cy="16" r="16" fill="#172033"/><circle cx="58" cy="16" r="16" fill="#2459c7"/>
      <circle cx="100" cy="16" r="16" fill="#dce9ff"/><circle cx="142" cy="16" r="16" fill="#ffffff" stroke="#e1e7ef"/>
    </g>
    <text x="30" y="610" class="body">Best fit: a crisp developer-tool personality.</text>
  </g>
</svg>
