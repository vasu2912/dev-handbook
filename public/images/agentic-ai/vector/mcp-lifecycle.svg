" stroke-width="3" fill="none"></path></g></g><mask></mask><g transform="translate(480 350) rotate(0 275 21)"><text x="275" y="16.3935546875" font-family="Cascadia, Segoe UI Emoji" font-size="17px" fill="#5b21b6" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">tools/call + per-request protocol metadata</text><text x="275" y="37.3935546875" font-family="Cascadia, Segoe UI Emoji" font-size="17px" fill="#5b21b6" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">HTTP also carries method and name headers</text></g><g stroke-linecap="round"><g transform="translate(1250 490) rotate(0 -500 0)"><path d="M0 0 C-307.95 0, -615.9 0, -1000 0 M0 0 C-315.51 0, -631.02 0, -1000 0" stroke="#c2410c" stroke-width="3" fill="none"></path></g><g transform="translate(1250 490) rotate(0 -500 0)"><path d="M-976.51 -8.55 C-983.74 -5.92, -990.98 -3.28, -1000 0 M-976.51 -8.55 C-983.92 -5.85, -991.33 -3.15, -1000 0" stroke="#c2410c" stroke-width="3" fill="none"></path></g><g transform="translate(1250 490) rotate(0 -500 0)"><path d="M-976.51 8.55 C-983.74 5.92, -990.98 3.28, -1000 0 M-976.51 8.55 C-983.92 5.85, -991.33 3.15, -1000 0" stroke="#c2410c" stroke-width="3" fill="none"></path></g></g><mask></mask><g transform="translate(515 450) rotate(0 235 17.5)"><text x="235" y="23.3935546875" font-family="Cascadia, Segoe UI Emoji" font-size="17px" fill="#9a3412" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">result, structured content, or typed error</text></g><g stroke-linecap="round" transform="translate(410 580) rotate(0 340 52.5)"><path d="M26.25 0 C219.16 0, 412.07 0, 653.75 0 C671.25 0, 680 8.75, 680 26.25 C680 41.77, 680 57.28, 680 78.75 C680 96.25, 671.25 105, 653.75 105 C513.58 105, 373.41 105, 26.25 105 C8.75 105, 0 96.25, 0 78.75 C0 58.87, 0 38.98, 0 26.25 C0 8.75, 8.75 0, 26.25 0" stroke="none" stroke-width="0" fill="#fef2f2"></path><path d="M26.25 0 C