<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">OSI seven-layer model</title>
  <desc id="desc">Seven network layers are shown from physical at the bottom to application at the top, with each layer's responsibility and common examples.</desc>
  <defs>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#334155;--accent:#2563eb;--layer-stroke:#94a3b8;--l7-bg:#dbeafe;--l6-bg:#e0e7ff;--l5-bg:#ede9fe;--l4-bg:#fef3c7;--l3-bg:#ffedd5;--l2-bg:#dcfce7;--l1-bg:#f1f5f9}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--accent:#60a5fa;--layer-stroke:#334155;--l7-bg:#1e3a5f;--l6-bg:#312e81;--l5-bg:#3b0764;--l4-bg:#713f12;--l3-bg:#7c2d12;--l2-bg:#14532d;--l1-bg:#0f172a}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.name{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--muted)}.num{font-size:14px;font-weight:700;fill:var(--accent)}</style>
  </defs>
  <rect width="1000" height="650" rx="18" fill="var(--bg)" stroke="var(--border)"/><text x="500" y="34" text-anchor="middle" class="name">OSI model: responsibilities move from wire to application</text>
  <g stroke="var(--layer-stroke)" stroke-width="1">
    <rect x="60" y="60" width="880" height="70" rx="8" fill="var(--l7-bg)"/><rect x="60" y="130" width="880" height="70" fill="var(--l6-bg)"/><rect x="60" y="200" width="880" height="70" fill="var(--l5-bg)"/><rect x="60" y="270" width="880" height="70" fill="var(--l4-bg)"/><rect x="60" y="340" width="880" height="70" fill="var(--l3-bg)"/><rect x="60" y="410" width="880" height="70" fill="var(--l2-bg)"/><rect x="60" y="480" width="880" height="70" rx="8" fill="var(--l1-bg)"/>
  </g>
  <g class="num"><text x="82" y="88">7</text><text x="82" y="158">6</text><text x="82" y="228">5</text><text x="82" y="298">4</text><text x="82" y="368">3</text><text x="82" y="438">2</text><text x="82" y="508">1</text></g>
  <g class="name"><text x="115" y="88">Application</text><text x="115" y="158">Presentation</text><text x="115" y="228">Session</text><text x="115" y="298">Transport</text><text x="115" y="368">Network</text><text x="115" y="438">Data link</text><text x="115" y="508">Physical</text></g>
  <g class="small"><text x="300" y="88">User-facing network services</text><text x="300" y="110">HTTP, DNS, SMTP</text><text x="300" y="158">Format, encrypt, and compress data</text><text x="300" y="180">TLS, JSON, JPEG</text><text x="300" y="228">Open, manage, and close sessions</text><text x="300" y="250">RPC, session tokens</text><text x="300" y="298">Deliver an ordered or datagram stream</text><text x="300" y="320">TCP, UDP</text><text x="300" y="368">Route packets between networks</text><text x="300" y="390">IP, ICMP, routers</text><text x="300" y="438">Frame data on a local link</text><text x="300" y="460">Ethernet, Wi-Fi, switches</text><text x="300" y="508">Transmit bits over a medium</text><text x="300" y="530">Cables, radio, signals</text></g>
  <path d="M690 90V520" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5"/><g class="small"><text x="720" y="110">Payload becomes</text><text x="720" y="130">a message</text><text x="720" y="180">a representation</text><text x="720" y="250">a session</text><text x="720" y="320">a segment or datagram</text><text x="720" y="390">a packet</text><text x="720" y="460">a frame</text><text x="720" y="530">bits on the medium</text></g>
</svg>
