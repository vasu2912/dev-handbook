<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">Remote procedure call request flow</title>
  <desc id="desc">A client program calls a client stub. The client communication module sends a request to the server communication module, which invokes a server stub and procedure. The reply returns along the same path.</desc>
  <defs>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--accent:#2563eb;--client-outer:#eff6ff;--client-prog:#dbeafe;--client-stub:#bfdbfe;--server-outer:#f0fdf4;--server-stroke:#16a34a;--server-stub:#bbf7d0;--server-proc:#dcfce7;--green-arrow:#15803d;--dashed:#94a3b8}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--accent:#60a5fa;--client-outer:#172554;--client-prog:#1e3a5f;--client-stub:#2563a8;--server-outer:#052e16;--server-stroke:#4ade80;--server-stub:#166534;--server-proc:#14532d;--green-arrow:#4ade80;--dashed:#475569}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--muted)}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--green-arrow)"/></marker>
  </defs>
  <rect width="1100" height="400" rx="18" fill="var(--bg)" stroke="var(--border)"/><text x="550" y="34" text-anchor="middle" class="label">RPC hides message encoding behind a procedure call</text>
  <rect x="55" y="80" width="390" height="250" rx="18" fill="var(--client-outer)" stroke="var(--accent)" stroke-width="2"/><rect x="655" y="80" width="390" height="250" rx="18" fill="var(--server-outer)" stroke="var(--server-stroke)" stroke-width="2"/>
  <text x="250" y="112" text-anchor="middle" class="label">Client process</text><text x="850" y="112" text-anchor="middle" class="label">Server process</text>
  <g stroke-width="2"><rect x="90" y="160" width="120" height="70" rx="10" fill="var(--client-prog)" stroke="var(--accent)"/><rect x="260" y="160" width="145" height="70" rx="10" fill="var(--client-stub)" stroke="var(--accent)"/><rect x="695" y="160" width="145" height="70" rx="10" fill="var(--server-stub)" stroke="var(--server-stroke)"/><rect x="890" y="160" width="120" height="70" rx="10" fill="var(--server-proc)" stroke="var(--server-stroke)"/></g>
  <g text-anchor="middle"><text x="150" y="194" class="small">client program</text><text x="332" y="194" class="small">client stub</text><text x="767" y="194" class="small">server stub</text><text x="950" y="194" class="small">procedure</text></g>
  <path d="M445 175H655" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/><path d="M655 255H445" stroke="var(--green-arrow)" stroke-width="2" marker-end="url(#green)"/><text x="550" y="165" text-anchor="middle" class="small">request: encode + send</text><text x="550" y="278" text-anchor="middle" class="small">reply: receive + decode</text>
  <path d="M405 195H695" stroke="var(--dashed)" stroke-width="2" stroke-dasharray="5 5"/><text x="550" y="350" text-anchor="middle" class="small">The network call can time out or fail, unlike a local function call.</text>
</svg>
