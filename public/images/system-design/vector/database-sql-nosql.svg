<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-labelledby="title desc">
  <title id="title">Relational and document data models</title>
  <desc id="desc">A relational model organizes fixed columns and rows in tables. A document model stores a complete, nested object as JSON with flexible fields.</desc>
  <defs>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--card-bg:#fff;--sql-stroke:#2563eb;--doc-stroke:#0284c7;--grid-stroke:#94a3b8;--table-bg:#eff6ff;--json-bg:#ecfeff;--teal:#0f766e}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--card-bg:#1e293b;--sql-stroke:#60a5fa;--doc-stroke:#38bdf8;--grid-stroke:#334155;--table-bg:#172554;--json-bg:#164e63;--teal:#2dd4bf}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.teal-txt{fill:var(--teal)}</style>
  </defs>
  <g><rect x="12" y="12" width="796" height="296" rx="16" fill="var(--bg)" stroke="var(--border)"/><text x="36" y="46" font-size="18" font-weight="700">SQL and NoSQL data models</text>
    <rect x="42" y="78" width="340" height="196" rx="12" fill="var(--card-bg)" stroke="var(--sql-stroke)" stroke-width="2"/><rect x="438" y="78" width="340" height="196" rx="12" fill="var(--card-bg)" stroke="var(--doc-stroke)" stroke-width="2"/><text x="212" y="108" text-anchor="middle" font-size="16" font-weight="650">Relational table</text><text x="608" y="108" text-anchor="middle" font-size="16" font-weight="650">Document</text>
    <g stroke="var(--grid-stroke)"><rect x="76" y="132" width="272" height="106" fill="var(--table-bg)"/><path d="M76 158h272M76 184h272M76 210h272M144 132v106M240 132v106"/></g><g font-size="12" text-anchor="middle"><text x="110" y="150">id</text><text x="192" y="150">name</text><text x="294" y="150">status</text><text x="110" y="176">42</text><text x="192" y="176">Ada</text><text x="294" y="176">active</text><text x="110" y="202">43</text><text x="192" y="202">Lin</text><text x="294" y="202">pending</text><text x="110" y="228">44</text><text x="192" y="228">Sam</text><text x="294" y="228">active</text></g>
    <rect x="474" y="132" width="268" height="108" rx="8" fill="var(--json-bg)" stroke="var(--teal)"/><text x="496" y="156" font-size="13" class="teal-txt">{</text><text x="514" y="176" font-size="13">"id": 42,</text><text x="514" y="196" font-size="13">"name": "Ada",</text><text x="514" y="216" font-size="13">"tags": ["admin"]</text><text x="718" y="236" font-size="13" class="teal-txt">}</text><text x="212" y="260" text-anchor="middle" font-size="12" class="muted">fixed columns, joins, constraints</text><text x="608" y="260" text-anchor="middle" font-size="12" class="muted">nested fields, flexible shape</text>
  </g>
</svg>
