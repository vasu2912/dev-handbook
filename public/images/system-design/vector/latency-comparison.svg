<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Latency comparison</title><desc id="desc">A logarithmic-style comparison of common computer operation latencies, from one nanosecond for a CPU cycle to 150 milliseconds for a network round trip.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--muted:#53657d;--blue:#2563eb;--green:#0f766e;--orange:#c2410c;--red:#b91c1c}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--muted:#9fb3cc;--blue:#93c5fd;--green:#5eead4;--orange:#fdba74;--red:#fca5a5}}text{font:15px system-ui,sans-serif;fill:var(--ink)}.grid{stroke:var(--muted);stroke-width:1;opacity:.45}.bar{rx:4}.value{font-size:13px;font-weight:600}</style><rect width="1000" height="520" fill="var(--bg)"/><text x="28" y="36" font-size="23" font-weight="700">Common operation latencies</text><text x="28" y="58" font-size="14" fill="var(--muted)">Approximate values. Each column spans the next order of magnitude.</text>
<g class="grid"><path d="M250 95v350M390 95v350M530 95v350M670 95v350M810 95v350M950 95v350"/></g><g font-size="13" fill="var(--muted)"><text x="250" y="80" text-anchor="middle">1 ns</text><text x="390" y="80" text-anchor="middle">10 ns</text><text x="530" y="80" text-anchor="middle">100 ns</text><text x="670" y="80" text-anchor="middle">1 μs</text><text x="810" y="80" text-anchor="middle">10 μs</text><text x="950" y="80" text-anchor="middle">100 μs+</text></g>
<g><rect class="bar" x="250" y="110" width="22" height="22" fill="var(--blue)"/><text class="value" x="285" y="126">CPU cycle, 1 ns</text><rect class="bar" x="255" y="158" width="40" height="22" fill="var(--blue)"/><text class="value" x="308" y="174">L1 cache, 0.5 ns</text><rect class="bar" x="300" y="206" width="66" height="22" fill="var(--blue)"/><text class="value" x="380" y="222">Branch mispredict, 5 ns</text><rect class="bar" x="320" y="254" width="88" height="22" fill="var(--blue)"/><text class="value" x="420" y="270">L2 cache, 7 ns</text><rect class="bar" x="360" y="302" width="120" height="22" fill="var(--green)"/><text class="value" x="492" y="318">Mutex lock, 25 ns</text><rect class="bar" x="430" y="350" width="190" height="22" fill="var(--green)"/><text class="value" x="632" y="366">Main memory, 100 ns</text><rect class="bar" x="520" y="398" width="265" height="22" fill="var(--orange)"/><text class="value" x="797" y="414">SSD read, 150 μs</text><rect class="bar" x="700" y="446" width="250" height="22" fill="var(--red)"/><text class="value" x="28" y="462">Network round trip, 150 ms</text></g><text x="28" y="500" font-size="13" fill="var(--muted)">Source: <tspan text-decoration="underline">Latency numbers every programmer should know</tspan> by Jeff Dean.</text></svg>
