<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">AWS service, initial architecture</title><desc id="desc">A client reaches a DNS record and a single web server. The server reads and writes one SQL database and an object store.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--client:#d9f99d;--edge:#e0e7ff;--app:#dbeafe;--data:#bfdbfe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--client:#365314;--edge:#312e81;--app:#1e3a5f;--data:#1e4b73}}text{font:18px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect width="960" height="540" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="70" y="44" width="180" height="56" fill="var(--client)"/><text x="160" y="79">Client</text><rect class="box" x="390" y="44" width="180" height="56" fill="var(--edge)"/><text x="480" y="79">DNS</text><rect class="box" x="710" y="44" width="180" height="56" fill="var(--edge)"/><text x="800" y="79">CDN</text><path class="flow" d="M250 72h140"/><path class="flow" d="M570 72h140"/><rect class="box" x="380" y="190" width="200" height="64" fill="var(--app)"/><text x="480" y="229">Web server</text><path class="flow" d="M480 100v90"/><rect class="box" x="220" y="380" width="220" height="64" fill="var(--data)"/><text x="330" y="419">SQL database</text><rect class="box" x="520" y="380" width="220" height="64" fill="var(--data)"/><text x="630" y="419">Object store</text><path class="flow" d="M430 254v78H330v48"/><path class="flow" d="M530 254v78h100v48"/></g><text x="24" y="500" font-size="15" fill="var(--ink)">One instance handles application traffic, relational data, and stored content.</text></svg>
