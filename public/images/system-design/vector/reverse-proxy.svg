<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Reverse proxy between the internet and an internal server</title>
  <desc id="desc">A public client reaches one reverse proxy address. The proxy terminates or passes through TLS, applies controls, and forwards the request to an internal web server before returning the response.</desc>
  <defs>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--accent:#2563eb;--cloud-bg:#e2e8f0;--cloud-stroke:#64748b;--proxy-outer:#eff6ff;--proxy-inner:#bfdbfe;--server-outer:#f0fdf4;--server-inner:#dcfce7;--green-stroke:#16a34a;--green-arrow:#15803d;--yellow-bg:#fef3c7;--yellow-stroke:#d97706}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--accent:#60a5fa;--cloud-bg:#334155;--cloud-stroke:#94a3b8;--proxy-outer:#172554;--proxy-inner:#2563a8;--server-outer:#052e16;--server-inner:#14532d;--green-stroke:#4ade80;--green-arrow:#4ade80;--yellow-bg:#713f12;--yellow-stroke:#fbbf24}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--muted)}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--green-arrow)"/></marker>
  </defs>
  <rect width="1100" height="390" rx="18" fill="var(--bg)" stroke="var(--border)"/><text x="550" y="36" text-anchor="middle" class="label">One public address mediates access to internal servers</text>
  <path d="M70 190 120 140 190 140 235 190 190 240 120 240Z" fill="var(--cloud-bg)" stroke="var(--cloud-stroke)" stroke-width="2"/><text x="152" y="194" text-anchor="middle" class="label">Internet</text>
  <rect x="330" y="115" width="250" height="150" rx="16" fill="var(--proxy-outer)" stroke="var(--accent)" stroke-width="2"/><rect x="395" y="158" width="120" height="64" rx="10" fill="var(--proxy-inner)" stroke="var(--accent)" stroke-width="2"/><text x="455" y="187" text-anchor="middle" class="label">Proxy</text><text x="455" y="207" text-anchor="middle" class="small">public address</text>
  <rect x="750" y="125" width="260" height="130" rx="16" fill="var(--server-outer)" stroke="var(--green-stroke)" stroke-width="2"/><rect x="820" y="158" width="120" height="64" rx="10" fill="var(--server-inner)" stroke="var(--green-stroke)" stroke-width="2"/><text x="880" y="187" text-anchor="middle" class="label">Web server</text><text x="880" y="207" text-anchor="middle" class="small">private network</text>
  <path d="M235 190H330" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 190H750" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 220H580" stroke="var(--green-arrow)" stroke-width="2" marker-end="url(#green)"/><path d="M330 220H235" stroke="var(--green-arrow)" stroke-width="2" marker-end="url(#green)"/>
  <g class="small" text-anchor="middle"><text x="282" y="180">request</text><text x="665" y="180">forward</text><text x="665" y="241">response</text><text x="282" y="241">return</text></g>
  <rect x="330" y="305" width="610" height="42" rx="10" fill="var(--yellow-bg)" stroke="var(--yellow-stroke)"/><text x="635" y="331" text-anchor="middle" class="small">TLS termination, access controls, compression, caching, and static files</text>
</svg>
