<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Sales-rank service, scaled design</title><desc id="desc">Clients use DNS and a CDN before a load balancer and web servers. Sales and read APIs use a memory cache, SQL write master, SQL read replicas, object storage, and a sales-rank service.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--edge:#e0e7ff;--app:#dbeafe;--cache:#a5f3fc;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--edge:#312e81;--app:#1e3a5f;--cache:#155e75;--data:#312e81}}text{font:15px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect width="1100" height="620" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="30" y="25" width="130" height="44" fill="var(--edge)"/><text x="95" y="53">Client</text><rect class="box" x="180" y="25" width="130" height="44" fill="var(--edge)"/><text x="245" y="53">DNS</text><rect class="box" x="330" y="25" width="130" height="44" fill="var(--edge)"/><text x="395" y="53">CDN</text><rect class="box" x="480" y="25" width="160" height="44" fill="var(--app)"/><text x="560" y="53">Load balancer</text><path class="flow" d="M160 47h20M310 47h20M460 47h20"/><rect class="box" x="480" y="105" width="160" height="44" fill="var(--app)"/><text x="560" y="133">Web servers</text><path class="flow" d="M560 69v36"/>
<rect class="box" x="90" y="205" width="160" height="50" fill="var(--app)"/><text x="170" y="236">Sales API</text><rect class="box" x="330" y="205" width="160" height="50" fill="var(--app)"/><text x="410" y="236">Read API</text><rect class="box" x="570" y="205" width="180" height="50" fill="var(--app)"/><text x="660" y="236">Sales-rank service</text><path class="flow" d="M560 149v31H170v25M560 149v56H410M560 149v31h100v25"/>
<rect class="box" x="70" y="350" width="180" height="52" fill="var(--cache)"/><text x="160" y="382">Memory cache</text><rect class="box" x="290" y="350" width="180" height="52" fill="var(--data)"/><text x="380" y="382">SQL write master</text><rect class="box" x="510" y="350" width="180" height="52" fill="var(--data)"/><text x="600" y="382">SQL read replicas</text><rect class="box" x="730" y="350" width="180" height="52" fill="var(--data)"/><text x="820" y="382">Object store</text><path class="flow" d="M170 255v95M410 255v95M410 255v64H600v31M660 255v95M170 255v64H820v31"/>
<rect class="box" x="400" y="485" width="220" height="52" fill="var(--data)"/><text x="510" y="517">Hourly rank table</text><path class="flow" d="M600 402v83M820 402v40H510v43"/></g><text x="20" y="575" font-size="14" fill="var(--ink)">Batch jobs aggregate raw sales in object storage; read traffic uses cached rank results.</text></svg>
