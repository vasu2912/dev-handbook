<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Web crawler, scaled design</title><desc id="desc">Clients use DNS and a load balancer before query and crawler services. Queues connect the crawler to reverse index and document services, with a memory cache and NoSQL store.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--edge:#e0e7ff;--app:#dbeafe;--queue:#bae6fd;--cache:#a5f3fc;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--edge:#312e81;--app:#1e3a5f;--queue:#164e63;--cache:#155e75;--data:#312e81}}text{font:15px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect width="1100" height="620" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="30" y="25" width="130" height="44" fill="var(--edge)"/><text x="95" y="53">Client</text><rect class="box" x="180" y="25" width="130" height="44" fill="var(--edge)"/><text x="245" y="53">DNS</text><rect class="box" x="330" y="25" width="160" height="44" fill="var(--app)"/><text x="410" y="53">Load balancer</text><path class="flow" d="M160 47h20M310 47h20"/><rect class="box" x="330" y="105" width="160" height="44" fill="var(--app)"/><text x="410" y="133">Web servers</text><path class="flow" d="M410 69v36"/><rect class="box" x="50" y="205" width="155" height="50" fill="var(--app)"/><text x="127" y="236">Query API</text><rect class="box" x="250" y="205" width="180" height="50" fill="var(--app)"/><text x="340" y="236">Crawler service</text><rect class="box" x="475" y="205" width="155" height="50" fill="var(--queue)"/><text x="552" y="236">Crawl queues</text><path class="flow" d="M410 149v31H127v25M410 149v56H340M410 149v31h142v25"/>
<rect class="box" x="50" y="350" width="170" height="52" fill="var(--cache)"/><text x="135" y="382">Memory cache</text><rect class="box" x="255" y="350" width="180" height="52" fill="var(--app)"/><text x="345" y="382">Reverse index</text><rect class="box" x="470" y="350" width="180" height="52" fill="var(--app)"/><text x="560" y="382">Document service</text><rect class="box" x="685" y="350" width="180" height="52" fill="var(--data)"/><text x="775" y="382">NoSQL store</text><path class="flow" d="M127 255v95M127 255v55H135v40M340 255v95M340 255v55H345v40M552 255v95M340 255v55H775v40M560 402v43H775v-43"/></g><text x="20" y="505" font-size="14" fill="var(--ink)">Queues absorb crawl bursts; shards handle index and document volume, while cache serves hot queries.</text></svg>
