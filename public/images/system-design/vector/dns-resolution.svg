<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">DNS recursive resolution</title>
  <desc id="desc">A client asks a recursive resolver for an address. The resolver queries a root server and the authoritative server, caches the answer for its TTL, and returns the IP address to the client.</desc>
  <defs>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--accent:#2563eb;--client-bg:#dbeafe;--purple-bg:#ede9fe;--purple-stroke:#7c3aed;--yellow-bg:#fef3c7;--yellow-stroke:#d97706;--green-bg:#dcfce7;--green-stroke:#16a34a;--green-arrow:#15803d;--cache-bg:#eff6ff}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--accent:#60a5fa;--client-bg:#1e3a5f;--purple-bg:#3b0764;--purple-stroke:#a78bfa;--yellow-bg:#713f12;--yellow-stroke:#fbbf24;--green-bg:#14532d;--green-stroke:#4ade80;--green-arrow:#4ade80;--cache-bg:#172554}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--muted)}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--green-arrow)"/></marker>
  </defs>
  <rect width="1100" height="470" rx="18" fill="var(--bg)" stroke="var(--border)"/><text x="550" y="36" text-anchor="middle" class="label">Resolve a name, then cache the answer</text>
  <g stroke-width="2"><rect x="65" y="180" width="150" height="76" rx="10" fill="var(--client-bg)" stroke="var(--accent)"/><rect x="300" y="180" width="175" height="76" rx="10" fill="var(--purple-bg)" stroke="var(--purple-stroke)"/><rect x="560" y="90" width="150" height="76" rx="10" fill="var(--yellow-bg)" stroke="var(--yellow-stroke)"/><rect x="820" y="90" width="190" height="76" rx="10" fill="var(--green-bg)" stroke="var(--green-stroke)"/></g>
  <g text-anchor="middle"><text x="140" y="214" class="label">Client</text><text x="140" y="236" class="small">www.example.com?</text><text x="387" y="214" class="label">Recursive</text><text x="387" y="236" class="small">resolver + cache</text><text x="635" y="124" class="label">Root DNS</text><text x="635" y="146" class="small">delegates the TLD</text><text x="915" y="124" class="label">Authoritative DNS</text><text x="915" y="146" class="small">A: 192.0.2.10</text></g>
  <path d="M215 198H300" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/><path d="M475 198 560 138" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 128H820" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 155 475 225" stroke="var(--green-arrow)" stroke-width="2" marker-end="url(#green)"/><path d="M300 240H215" stroke="var(--green-arrow)" stroke-width="2" marker-end="url(#green)"/>
  <g class="small" text-anchor="middle"><text x="257" y="187">query</text><text x="520" y="170">iterative query</text><text x="765" y="116">delegation</text><text x="645" y="202">answer cached by TTL</text><text x="257" y="260">IP answer</text></g>
  <rect x="175" y="325" width="750" height="66" rx="12" fill="var(--cache-bg)" stroke="var(--accent)"/><text x="550" y="350" text-anchor="middle" class="label">Cache layers</text><text x="550" y="374" text-anchor="middle" class="small">Browser and operating system caches may answer before the recursive resolver is queried.</text>
  <text x="550" y="435" text-anchor="middle" class="small">A low TTL propagates changes sooner, but increases lookup traffic.</text>
</svg>
