<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="title desc">
  <title id="title">Write-behind cache flow</title>
  <desc id="desc">The application writes to a cache and receives an immediate response. The cache places an event on a durable queue, and a worker later writes the database.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="var(--blue)"/></marker>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--card:#ffffff;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--blue:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--blue:#60a5fa}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}</style>
  </defs>
  <rect x="12" y="12" width="796" height="316" rx="16" fill="var(--bg)" stroke="var(--border)"/>
  <text x="36" y="48" font-size="18" font-weight="700">Write-behind</text>
  <g fill="var(--card)" stroke="var(--blue)" stroke-width="2"><rect x="36" y="118" width="140" height="60" rx="10"/><rect x="238" y="118" width="140" height="60" rx="10"/><path d="M446 118h120l18 30-18 30H446l-18-30z"/><rect x="636" y="118" width="140" height="60" rx="10"/><rect x="430" y="244" width="150" height="56" rx="10"/></g>
  <g font-size="15" text-anchor="middle"><text x="106" y="153">Application</text><text x="308" y="153">Cache</text><text x="506" y="153">Queue</text><text x="706" y="153">Database</text><text x="505" y="277">Event worker</text></g>
  <g fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#a)"><path d="M176 148h62"/><path d="M378 148h48"/><path d="M584 148h52"/><path d="M506 178v64"/><path d="M580 272h52v-94"/><path d="M238 118V78H106v40"/></g>
  <g font-size="12" fill="var(--muted)"><text x="183" y="109">1. write</text><text x="386" y="109">2. enqueue</text><text x="588" y="109">4. persist later</text><text x="118" y="70">3. acknowledge</text></g>
</svg>
