<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Personal finance service, scaled design</title><desc id="desc">Clients use DNS, a CDN, and a load balancer before web servers and account, transaction, category, and notification services. A queue, memory cache, SQL replicas, object store, and read API support scale.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--edge:#e0e7ff;--app:#dbeafe;--queue:#bae6fd;--cache:#a5f3fc;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--edge:#312e81;--app:#1e3a5f;--queue:#164e63;--cache:#155e75;--data:#312e81}}text{font:14px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect width="1100" height="620" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="25" y="25" width="120" height="42" fill="var(--edge)"/><text x="85" y="52">Client</text><rect class="box" x="165" y="25" width="120" height="42" fill="var(--edge)"/><text x="225" y="52">DNS</text><rect class="box" x="305" y="25" width="120" height="42" fill="var(--edge)"/><text x="365" y="52">CDN</text><rect class="box" x="445" y="25" width="160" height="42" fill="var(--app)"/><text x="525" y="52">Load balancer</text><path class="flow" d="M145 46h20M285 46h20M425 46h20"/><rect class="box" x="445" y="100" width="160" height="42" fill="var(--app)"/><text x="525" y="127">Web servers</text><path class="flow" d="M525 67v33"/>
<rect class="box" x="25" y="190" width="145" height="48" fill="var(--app)"/><text x="97" y="220">Accounts API</text><rect class="box" x="195" y="190" width="145" height="48" fill="var(--app)"/><text x="267" y="220">Transactions</text><rect class="box" x="365" y="190" width="145" height="48" fill="var(--app)"/><text x="437" y="220">Category service</text><rect class="box" x="535" y="190" width="145" height="48" fill="var(--queue)"/><text x="607" y="220">Queue</text><rect class="box" x="705" y="190" width="145" height="48" fill="var(--app)"/><text x="777" y="220">Read API</text><path class="flow" d="M525 142v25H97v23M525 142v48H267M525 142v25H437v23M525 142v48H607M525 142v25H777v23"/>
<rect class="box" x="55" y="335" width="170" height="50" fill="var(--cache)"/><text x="140" y="366">Memory cache</text><rect class="box" x="260" y="335" width="170" height="50" fill="var(--data)"/><text x="345" y="366">SQL write master</text><rect class="box" x="465" y="335" width="170" height="50" fill="var(--data)"/><text x="550" y="366">SQL read replicas</text><rect class="box" x="670" y="335" width="170" height="50" fill="var(--data)"/><text x="755" y="366">Object store</text><rect class="box" x="875" y="335" width="170" height="50" fill="var(--app)"/><text x="960" y="366">Notifications</text><path class="flow" d="M97 238v97M267 238v97M267 238v55H550v42M437 238v97M607 238v55H755v42M777 238v97M607 238v55H960v42"/></g><text x="20" y="500" font-size="14" fill="var(--ink)">Asynchronous extraction separates slow bank work from user requests; replicas and cache serve reads.</text></svg>
