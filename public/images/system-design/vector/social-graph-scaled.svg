<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Social graph, scaled design</title><desc id="desc">Clients use DNS, a load balancer, and web servers before query and graph services. A lookup service routes graph queries to person servers and a memory cache stores hot results.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--edge:#e0e7ff;--app:#dbeafe;--cache:#a5f3fc;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--edge:#312e81;--app:#1e3a5f;--cache:#155e75;--data:#312e81}}text{font:15px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect width="1100" height="620" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="30" y="25" width="130" height="44" fill="var(--edge)"/><text x="95" y="53">Client</text><rect class="box" x="180" y="25" width="130" height="44" fill="var(--edge)"/><text x="245" y="53">DNS</text><rect class="box" x="330" y="25" width="160" height="44" fill="var(--app)"/><text x="410" y="53">Load balancer</text><path class="flow" d="M160 47h20M310 47h20"/><rect class="box" x="330" y="105" width="160" height="44" fill="var(--app)"/><text x="410" y="133">Web servers</text><path class="flow" d="M410 69v36"/><rect class="box" x="70" y="205" width="160" height="50" fill="var(--app)"/><text x="150" y="236">Query API</text><rect class="box" x="280" y="205" width="190" height="50" fill="var(--app)"/><text x="375" y="236">User graph service</text><rect class="box" x="530" y="205" width="180" height="50" fill="var(--app)"/><text x="620" y="236">Lookup service</text><path class="flow" d="M410 149v31H150v25M410 149v56M490 127h130v78"/>
<rect class="box" x="50" y="350" width="180" height="52" fill="var(--cache)"/><text x="140" y="382">Memory cache</text><rect class="box" x="285" y="350" width="180" height="52" fill="var(--data)"/><text x="375" y="382">Person servers A</text><rect class="box" x="520" y="350" width="180" height="52" fill="var(--data)"/><text x="610" y="382">Person servers B</text><rect class="box" x="755" y="350" width="180" height="52" fill="var(--data)"/><text x="845" y="382">Person servers C</text><path class="flow" d="M150 255v95M375 255v95M620 255v95M620 255v55H845v40M375 255v55H140v40"/></g><text x="20" y="505" font-size="14" fill="var(--ink)">Caching and batched shard lookups reduce machine-to-machine hops during breadth-first search.</text></svg>
