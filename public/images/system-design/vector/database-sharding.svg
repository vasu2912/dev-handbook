<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="title desc">
  <title id="title">Database sharding by user ID</title>
  <desc id="desc">An application sends a user ID to a shard router. The router maps ID ranges to one of four databases, each owning a subset of users.</desc>
  <defs>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--accent:#2563eb;--app-bg:#dbeafe;--shard-bg:#fff}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--accent:#60a5fa;--app-bg:#1e3a5f;--shard-bg:#1e293b}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}</style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="var(--accent)"/></marker>
  </defs>
  <g><rect x="12" y="12" width="836" height="336" rx="16" fill="var(--bg)" stroke="var(--border)"/><text x="36" y="46" font-size="18" font-weight="700">Sharding by user ID</text><rect x="48" y="136" width="150" height="68" rx="12" fill="var(--app-bg)" stroke="var(--accent)" stroke-width="2"/><text x="123" y="166" text-anchor="middle" font-size="16" font-weight="650">Application</text><text x="123" y="187" text-anchor="middle" font-size="12" class="muted">user_id = 42</text><path d="M198 170h70" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#a)"/><path d="M268 170h44l16-28h44M268 170h44v0h44M268 170h44l16 28h44" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#a)"/>
    <g fill="var(--shard-bg)" stroke="var(--accent)" stroke-width="2"><rect x="416" y="76" width="166" height="56" rx="10"/><rect x="416" y="142" width="166" height="56" rx="10"/><rect x="416" y="208" width="166" height="56" rx="10"/><rect x="416" y="274" width="166" height="56" rx="10"/></g><g font-size="14" text-anchor="middle"><text x="499" y="109">Shard 0, IDs 0–24</text><text x="499" y="175">Shard 1, IDs 25–49</text><text x="499" y="241">Shard 2, IDs 50–74</text><text x="499" y="307">Shard 3, IDs 75–99</text></g><g font-size="12" class="muted"><text x="274" y="158">route by shard key</text><text x="608" y="109">owns this range</text><text x="608" y="175">owns this range</text><text x="608" y="241">owns this range</text><text x="608" y="307">owns this range</text></g>
  </g>
</svg>
