<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Social feed, scaled design</title><desc id="desc">Clients use DNS and a CDN before a load balancer and web servers. Read, write, and search APIs fan out to timeline, user, tweet, search, and notification services backed by cache, SQL replicas, and object storage.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--edge:#e0e7ff;--app:#dbeafe;--cache:#a5f3fc;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--edge:#312e81;--app:#1e3a5f;--cache:#155e75;--data:#312e81}}text{font:15px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect width="1100" height="620" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="30" y="24" width="125" height="42" fill="var(--edge)"/><text x="92" y="51">Client</text><rect class="box" x="175" y="24" width="125" height="42" fill="var(--edge)"/><text x="237" y="51">DNS</text><rect class="box" x="320" y="24" width="125" height="42" fill="var(--edge)"/><text x="382" y="51">CDN</text><rect class="box" x="465" y="24" width="155" height="42" fill="var(--app)"/><text x="542" y="51">Load balancer</text><path class="flow" d="M155 45h20M300 45h20M445 45h20"/>
<rect class="box" x="465" y="105" width="155" height="44" fill="var(--app)"/><text x="542" y="133">Web servers</text><path class="flow" d="M542 66v39"/><rect class="box" x="40" y="200" width="145" height="48" fill="var(--app)"/><text x="112" y="230">Read API</text><rect class="box" x="215" y="200" width="145" height="48" fill="var(--app)"/><text x="287" y="230">Write API</text><rect class="box" x="390" y="200" width="145" height="48" fill="var(--app)"/><text x="462" y="230">Search API</text><path class="flow" d="M542 149v28H112v23M542 149v51H287M542 149v28H462v23"/>
<rect class="box" x="20" y="310" width="145" height="48" fill="var(--app)"/><text x="92" y="340">Timeline</text><rect class="box" x="185" y="310" width="145" height="48" fill="var(--app)"/><text x="257" y="340">Fan-out</text><rect class="box" x="350" y="310" width="145" height="48" fill="var(--app)"/><text x="422" y="340">User graph</text><rect class="box" x="515" y="310" width="145" height="48" fill="var(--app)"/><text x="587" y="340">Search cluster</text><rect class="box" x="680" y="310" width="145" height="48" fill="var(--app)"/><text x="752" y="340">Notifications</text><path class="flow" d="M112 248v62M287 248v62M287 248v40h135v22M462 248v62M462 248v40h125v22"/>
<rect class="box" x="90" y="445" width="180" height="52" fill="var(--cache)"/><text x="180" y="477">Memory cache</text><rect class="box" x="320" y="445" width="180" height="52" fill="var(--data)"/><text x="410" y="477">SQL replicas</text><rect class="box" x="550" y="445" width="180" height="52" fill="var(--data)"/><text x="640" y="477">Object store</text><rect class="box" x="780" y="445" width="180" height="52" fill="var(--cache)"/><text x="870" y="477">Notification queue</text><path class="flow" d="M92 358v87M257 358v52H180v35M257 358v52h230v35M422 358v52h-12v35M587 358v87M752 358v87"/></g><text x="20" y="550" font-size="14" fill="var(--ink)">The fan-out path fills cached timelines; celebrity accounts can merge at read time.</text></svg>
