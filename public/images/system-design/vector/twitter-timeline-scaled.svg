<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Twitter timeline architecture at scale</title><desc id="desc">The write API sends posts to an ingester and fan-out service. Search index and timeline caches feed blender and timeline services, while push, batch compute, and client paths serve web and mobile users.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--write:#dbeafe;--cache:#bae6fd;--compute:#c7d2fe;--client:#d9f99d}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--write:#1e3a5f;--cache:#164e63;--compute:#312e81;--client:#365314}}text{font:15px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2.2;marker-end:url(#a)}.group{fill:var(--compute);opacity:.65;stroke:var(--line);stroke-width:1;rx:12}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect width="1100" height="650" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="450" y="25" width="200" height="52" fill="var(--client)"/><text x="550" y="58">Post composer</text><rect class="box" x="450" y="115" width="200" height="52" fill="var(--write)"/><text x="550" y="148">Write API</text><path class="flow" d="M550 77v38"/><rect class="box" x="205" y="225" width="190" height="52" fill="var(--write)"/><text x="300" y="258">Ingester</text><rect class="box" x="455" y="225" width="190" height="52" fill="var(--write)"/><text x="550" y="258">Fan-out service</text><path class="flow" d="M500 167v30H300v28M600 167v58"/><rect class="group" x="45" y="340" width="310" height="104"/><text x="200" y="366">Search index</text><rect class="box" x="90" y="380" width="220" height="44" fill="var(--cache)"/><text x="200" y="408">Earlybird shards</text><rect class="group" x="390" y="340" width="310" height="104"/><text x="545" y="366">Timeline cache</text><rect class="box" x="435" y="380" width="220" height="44" fill="var(--cache)"/><text x="545" y="408">Redis lists</text><rect class="group" x="735" y="340" width="320" height="104"/><text x="895" y="366">Push compute</text><rect class="box" x="780" y="380" width="230" height="44" fill="var(--cache)"/><text x="895" y="408">HTTP and mobile push</text><path class="flow" d="M300 277v63M550 277v63M550 277v40H200v23M550 277v40H895v23"/>
<rect class="box" x="170" y="505" width="190" height="52" fill="var(--write)"/><text x="265" y="537">Blender</text><rect class="box" x="455" y="505" width="190" height="52" fill="var(--write)"/><text x="550" y="537">Timeline service</text><rect class="box" x="740" y="505" width="190" height="52" fill="var(--compute)"/><text x="835" y="537">Hadoop batch jobs</text><path class="flow" d="M200 444v61M545 444v61M895 444v61"/><path class="flow" d="M265 557v43H120"/><path class="flow" d="M550 557v43H400"/><rect class="box" x="20" y="590" width="200" height="42" fill="var(--client)"/><text x="120" y="617">Web clients</text><rect class="box" x="300" y="590" width="200" height="42" fill="var(--client)"/><text x="400" y="617">Mobile clients</text></g></svg>
