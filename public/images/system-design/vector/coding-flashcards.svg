<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Coding flashcards</title><desc id="desc">An original illustration of a small stack of coding study cards with a terminal prompt.</desc><style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--green:#0f766e;--card:#dcfce7;--line:#53657d}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--green:#5eead4;--card:#14532d;--line:#9fb3cc}}text{font:26px system-ui,sans-serif;fill:var(--ink)}.card{fill:var(--card);stroke:var(--line);stroke-width:3;rx:14}.prompt{fill:var(--green);font:42px ui-monospace,monospace}</style><rect width="720" height="420" fill="var(--bg)"/><g transform="translate(140 44) rotate(7 220 150)"><rect class="card" x="48" y="38" width="430" height="270"/><rect class="card" x="24" y="20" width="430" height="270"/><rect class="card" width="430" height="270"/><text x="215" y="70" text-anchor="middle" font-weight="700">CODING</text><text x="215" y="104" text-anchor="middle" font-size="18">Practice notes</text><text class="prompt" x="75" y="195">&gt;_</text><path d="M155 180h180M155 220h140" stroke="var(--green)" stroke-width="9" stroke-linecap="round"/></g></svg>
