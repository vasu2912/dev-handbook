<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-labelledby="title desc">
  <title id="title">Refresh-ahead cache flow</title>
  <desc id="desc">A client reads through a cache. Before the cached entry expires, a refresh worker reloads it from storage so the next client read can be served without a miss.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="var(--blue)"/></marker>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--card:#ffffff;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--blue:#2563eb;--worker-bg:#e0f2fe;--worker-stroke:#0284c7}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--blue:#60a5fa;--worker-bg:#164e63;--worker-stroke:#38bdf8}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}</style>
  </defs>
  <rect x="12" y="12" width="796" height="256" rx="16" fill="var(--bg)" stroke="var(--border)"/>
  <text x="36" y="48" font-size="18" font-weight="700">Refresh-ahead</text>
  <g fill="var(--card)" stroke="var(--blue)" stroke-width="2"><rect x="36" y="112" width="130" height="58" rx="10"/><rect x="238" y="112" width="130" height="58" rx="10"/><rect x="634" y="112" width="130" height="58" rx="10"/></g>
  <path d="M430 112h118l18 29-18 29H430l-18-29z" fill="var(--worker-bg)" stroke="var(--worker-stroke)" stroke-width="2"/>
  <g font-size="15" text-anchor="middle"><text x="101" y="147">Client</text><text x="303" y="147">Cache</text><text x="490" y="147">Refresh worker</text><text x="699" y="147">Storage</text></g>
  <g fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#a)"><path d="M166 141h72"/><path d="M368 141h42"/><path d="M566 141h68"/><path d="M699 112V80H303v32"/></g>
  <g font-size="12" fill="var(--muted)"><text x="181" y="132">read</text><text x="374" y="132">near expiry</text><text x="574" y="132">reload</text><text x="466" y="72">replace before TTL</text></g>
</svg>
