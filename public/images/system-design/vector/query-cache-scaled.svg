<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Query cache, scaled design</title><desc id="desc">Clients use DNS and a CDN before a load balancer and web servers. Query APIs shard requests across cache nodes and fall through to reverse index and document service clusters.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--edge:#e0e7ff;--app:#dbeafe;--cache:#a5f3fc;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--edge:#312e81;--app:#1e3a5f;--cache:#155e75;--data:#312e81}}text{font:15px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect width="1100" height="620" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="25" y="25" width="125" height="42" fill="var(--edge)"/><text x="87" y="52">Client</text><rect class="box" x="170" y="25" width="125" height="42" fill="var(--edge)"/><text x="232" y="52">DNS</text><rect class="box" x="315" y="25" width="125" height="42" fill="var(--edge)"/><text x="377" y="52">CDN</text><rect class="box" x="460" y="25" width="160" height="42" fill="var(--app)"/><text x="540" y="52">Load balancer</text><path class="flow" d="M150 46h20M295 46h20M440 46h20"/><rect class="box" x="460" y="100" width="160" height="42" fill="var(--app)"/><text x="540" y="127">Web servers</text><path class="flow" d="M540 67v33"/><rect class="box" x="460" y="185" width="160" height="50" fill="var(--app)"/><text x="540" y="216">Query API</text><path class="flow" d="M540 142v43"/>
<rect class="box" x="50" y="310" width="170" height="50" fill="var(--cache)"/><text x="135" y="341">Cache shard 1</text><rect class="box" x="260" y="310" width="170" height="50" fill="var(--cache)"/><text x="345" y="341">Cache shard 2</text><rect class="box" x="470" y="310" width="170" height="50" fill="var(--cache)"/><text x="555" y="341">Cache shard 3</text><rect class="box" x="680" y="310" width="170" height="50" fill="var(--app)"/><text x="765" y="341">Reverse index</text><rect class="box" x="890" y="310" width="170" height="50" fill="var(--app)"/><text x="975" y="341">Document service</text><path class="flow" d="M540 235v45H135v30M540 235v75H345M540 235v45h15v30M540 235v45H765v30M540 235v45H975v30"/><rect class="box" x="390" y="455" width="210" height="52" fill="var(--data)"/><text x="495" y="487">Consistent hashing ring</text><path class="flow" d="M345 360v55H495v40M555 360v55H495v40"/></g><text x="20" y="555" font-size="14" fill="var(--ink)">Consistent hashing limits cache movement when nodes change; misses query the index and document cluster.</text></svg>
