<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">Active-passive and active-active failover</title>
  <desc id="desc">In active-passive failover, a router sends traffic to an active node and promotes the standby node after heartbeats stop. In active-active failover, a router sends traffic to both nodes and removes an unhealthy node.</desc>
  <defs>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--accent:#2563eb;--client-bg:#dbeafe;--router-bg:#bfdbfe;--green-bg:#dcfce7;--green-stroke:#16a34a;--standby-bg:#e2e8f0;--standby-stroke:#64748b;--dashed-line:#94a3b8;--yellow-bg:#fef3c7;--yellow-stroke:#d97706;--green-marker:#15803d}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--accent:#60a5fa;--client-bg:#1e3a5f;--router-bg:#2563a8;--green-bg:#14532d;--green-stroke:#4ade80;--standby-bg:#334155;--standby-stroke:#94a3b8;--dashed-line:#64748b;--yellow-bg:#713f12;--yellow-stroke:#fbbf24;--green-marker:#4ade80}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.label{font-size:17px;font-weight:700}.small{font-size:14px;fill:var(--muted)}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--green-marker)"/></marker>
  </defs>
  <rect width="1100" height="470" rx="18" fill="var(--bg)" stroke="var(--border)"/><text x="275" y="38" text-anchor="middle" class="label">Active-passive</text><text x="825" y="38" text-anchor="middle" class="label">Active-active</text>
  <line x1="550" y1="65" x2="550" y2="430" stroke="var(--border)" stroke-width="2"/>
  <ellipse cx="85" cy="190" rx="58" ry="32" fill="var(--client-bg)" stroke="var(--accent)" stroke-width="2"/><rect x="165" y="153" width="115" height="74" rx="10" fill="var(--router-bg)" stroke="var(--accent)" stroke-width="2"/><rect x="350" y="105" width="130" height="74" rx="10" fill="var(--green-bg)" stroke="var(--green-stroke)" stroke-width="2"/><rect x="350" y="260" width="130" height="74" rx="10" fill="var(--standby-bg)" stroke="var(--standby-stroke)" stroke-width="2"/>
  <path d="M143 190H165M280 190 350 142" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 205 350 297" stroke="var(--dashed-line)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M415 179V260" stroke="var(--yellow-stroke)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <g text-anchor="middle"><text x="85" y="196" class="label">Client</text><text x="222" y="183" class="label">Router</text><text x="415" y="135" class="label">Active</text><text x="415" y="290" class="label">Standby</text><text x="415" y="355" class="small">heartbeat, then promote</text></g>
  <ellipse cx="635" cy="190" rx="58" ry="32" fill="var(--client-bg)" stroke="var(--accent)" stroke-width="2"/><rect x="715" y="153" width="115" height="74" rx="10" fill="var(--router-bg)" stroke="var(--accent)" stroke-width="2"/><rect x="900" y="105" width="130" height="74" rx="10" fill="var(--green-bg)" stroke="var(--green-stroke)" stroke-width="2"/><rect x="900" y="260" width="130" height="74" rx="10" fill="var(--green-bg)" stroke="var(--green-stroke)" stroke-width="2"/>
  <path d="M693 190H715M830 178 900 142M830 205 900 297" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"/><path d="M930 179V260" stroke="var(--green-stroke)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#green)"/>
  <g text-anchor="middle"><text x="635" y="196" class="label">Client</text><text x="772" y="183" class="label">Router</text><text x="965" y="135" class="label">Node A</text><text x="965" y="290" class="label">Node B</text><text x="965" y="355" class="small">both serve traffic</text></g>
  <rect x="74" y="395" width="952" height="42" rx="10" fill="var(--yellow-bg)" stroke="var(--yellow-stroke)"/><text x="550" y="421" text-anchor="middle" class="small">Failover requires health checks, promotion rules, and a plan for stale or unreplicated writes.</text>
</svg>
