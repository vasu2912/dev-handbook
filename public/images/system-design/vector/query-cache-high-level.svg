<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Query cache, high-level design</title><desc id="desc">A client reaches a web server and query API. The API checks a memory cache, then calls reverse index and document services on a miss.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--client:#d9f99d;--api:#dbeafe;--svc:#bfdbfe;--cache:#bae6fd}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--client:#365314;--api:#1e3a5f;--svc:#1e4b73;--cache:#164e63}}text{font:17px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs>
<rect width="960" height="540" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="395" y="20" width="170" height="50" fill="var(--client)"/><text x="480" y="52">Client</text><rect class="box" x="395" y="100" width="170" height="50" fill="var(--api)"/><text x="480" y="132">Web server</text><rect class="box" x="395" y="205" width="170" height="58" fill="var(--api)"/><text x="480" y="240">Query API</text><path class="flow" d="M480 70v30"/><path class="flow" d="M480 150v55"/>
<rect class="box" x="80" y="345" width="190" height="60" fill="var(--cache)"/><text x="175" y="380">Memory cache</text><rect class="box" x="385" y="345" width="190" height="60" fill="var(--svc)"/><text x="480" y="380">Reverse index</text><rect class="box" x="690" y="345" width="190" height="60" fill="var(--svc)"/><text x="785" y="380">Document service</text><path class="flow" d="M480 263v40H175v42"/><path class="flow" d="M480 263v82"/><path class="flow" d="M480 263v40h305v42"/></g><text x="24" y="500" font-size="15" fill="var(--ink)">A cache hit returns the stored result; a miss joins index IDs with document snippets.</text></svg>
