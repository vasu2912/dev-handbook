<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="title desc">
  <title id="title">Wide-column data model</title>
  <desc id="desc">A wide-column row is organized by row key, column families, and individual columns. The example row stores address and website fields.</desc>
  <defs>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--line:#334155;--card-bg:#fff;--row-bg:#dbeafe;--family-bg:#e0f2fe;--cell-bg:#fefce8}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--line:#64748b;--card-bg:#1e293b;--row-bg:#1e3a5f;--family-bg:#164e63;--cell-bg:#713f12}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}</style>
  </defs>
  <g><rect x="12" y="12" width="816" height="316" rx="16" fill="var(--bg)" stroke="var(--border)"/><text x="36" y="46" font-size="18" font-weight="700">Wide-column model</text><text x="36" y="70" font-size="12" class="muted">One row key can contain many columns grouped into families.</text>
    <rect x="66" y="108" width="708" height="174" rx="8" fill="var(--card-bg)" stroke="var(--line)" stroke-width="2"/><rect x="66" y="108" width="136" height="174" fill="var(--row-bg)" stroke="var(--line)"/><text x="134" y="198" text-anchor="middle" font-size="17" font-weight="650">row key</text><text x="134" y="224" text-anchor="middle" font-size="14">user:42</text>
    <rect x="202" y="108" width="286" height="42" fill="var(--family-bg)" stroke="var(--line)"/><rect x="488" y="108" width="286" height="42" fill="var(--family-bg)" stroke="var(--line)"/><text x="345" y="135" text-anchor="middle" font-size="15" font-weight="650">address family</text><text x="631" y="135" text-anchor="middle" font-size="15" font-weight="650">website family</text>
    <g fill="var(--cell-bg)" stroke="var(--line)"><rect x="202" y="150" width="143" height="66"/><rect x="345" y="150" width="143" height="66"/><rect x="488" y="150" width="143" height="66"/><rect x="631" y="150" width="143" height="66"/><rect x="202" y="216" width="143" height="66"/><rect x="345" y="216" width="143" height="66"/><rect x="488" y="216" width="143" height="66"/><rect x="631" y="216" width="143" height="66"/></g><g font-size="12"><text x="216" y="174">city</text><text x="216" y="194">San Francisco</text><text x="359" y="174">state</text><text x="359" y="194">California</text><text x="502" y="174">subdomain</text><text x="502" y="194">www</text><text x="645" y="174">domain</text><text x="645" y="194">example.com</text><text x="216" y="240">street</text><text x="216" y="260">Kearny St.</text><text x="502" y="240">protocol</text><text x="502" y="260">https</text></g>
  </g>
</svg>
