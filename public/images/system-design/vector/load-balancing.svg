<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc">
  <title id="title">Load balancer routes requests to healthy nodes</title>
  <desc id="desc">A client sends requests to a load balancer. The load balancer checks node health and distributes requests across three application nodes, while an unhealthy node receives no traffic.</desc>
  <defs>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--accent:#2563eb;--client-bg:#dbeafe;--lb-bg:#bfdbfe;--green-bg:#dcfce7;--green-stroke:#16a34a;--red-bg:#fee2e2;--red-stroke:#dc2626;--red-text:#b91c1c;--return-line:#64748b;--policy-bg:#eff6ff}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--accent:#60a5fa;--client-bg:#1e3a5f;--lb-bg:#2563a8;--green-bg:#14532d;--green-stroke:#4ade80;--red-bg:#7f1d1d;--red-stroke:#f87171;--red-text:#fca5a5;--return-line:#94a3b8;--policy-bg:#172554}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--muted)}.red-txt{fill:var(--red-text)}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="1100" height="450" rx="18" fill="var(--bg)" stroke="var(--border)"/><text x="550" y="36" text-anchor="middle" class="label">Distribute traffic across healthy capacity</text>
  <ellipse cx="95" cy="220" rx="62" ry="35" fill="var(--client-bg)" stroke="var(--accent)" stroke-width="2"/><rect x="220" y="168" width="170" height="104" rx="12" fill="var(--lb-bg)" stroke="var(--accent)" stroke-width="2"/><text x="95" y="226" text-anchor="middle" class="label">Client</text><text x="305" y="208" text-anchor="middle" class="label">Load balancer</text><text x="305" y="231" text-anchor="middle" class="small">health checks + policy</text>
  <g stroke-width="2"><rect x="620" y="95" width="170" height="70" rx="10" fill="var(--green-bg)" stroke="var(--green-stroke)"/><rect x="620" y="190" width="170" height="70" rx="10" fill="var(--green-bg)" stroke="var(--green-stroke)"/><rect x="620" y="285" width="170" height="70" rx="10" fill="var(--red-bg)" stroke="var(--red-stroke)"/></g>
  <g text-anchor="middle"><text x="705" y="137" class="label">Node A</text><text x="705" y="232" class="label">Node B</text><text x="705" y="327" class="label">Node C</text><text x="705" y="347" class="small">unhealthy</text></g>
  <g fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"><path d="M157 220H220"/><path d="M390 194 620 130"/><path d="M390 220H620"/><path d="M390 246 620 320"/></g><path d="M620 320H560" stroke="var(--red-stroke)" stroke-width="2" stroke-dasharray="6 5"/><text x="535" y="309" text-anchor="end" class="small red-txt">no traffic</text>
  <path d="M305 272V385H705V355" fill="none" stroke="var(--return-line)" stroke-width="2" stroke-dasharray="6 5"/><text x="505" y="407" text-anchor="middle" class="small">Responses return through the load balancer</text>
  <rect x="850" y="110" width="195" height="220" rx="12" fill="var(--policy-bg)" stroke="var(--accent)"/><text x="947" y="145" text-anchor="middle" class="label">Common policies</text><g text-anchor="middle" class="small"><text x="947" y="180">round robin</text><text x="947" y="207">least loaded</text><text x="947" y="234">weighted</text><text x="947" y="261">random</text><text x="947" y="288">session key</text></g>
</svg>
