<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Paste-sharing service, scaled design</title><desc id="desc">Clients use DNS and a CDN before a load balancer and web servers. Write, read, and analytics APIs use a memory cache, SQL replicas, a write master, analytics storage, and an object store.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--edge:#e0e7ff;--app:#dbeafe;--cache:#a5f3fc;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--edge:#312e81;--app:#1e3a5f;--cache:#155e75;--data:#312e81}}text{font:16px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2.2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect width="1100" height="620" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="25" y="28" width="135" height="45" fill="var(--edge)"/><text x="92" y="57">Client</text><rect class="box" x="185" y="28" width="135" height="45" fill="var(--edge)"/><text x="252" y="57">DNS</text><rect class="box" x="345" y="28" width="135" height="45" fill="var(--edge)"/><text x="412" y="57">CDN</text><rect class="box" x="505" y="28" width="170" height="45" fill="var(--app)"/><text x="590" y="57">Load balancer</text><path class="flow" d="M160 50h25"/><path class="flow" d="M320 50h25"/><path class="flow" d="M480 50h25"/>
<rect class="box" x="505" y="120" width="170" height="48" fill="var(--app)"/><text x="590" y="150">Web servers</text><path class="flow" d="M590 73v47"/>
<rect class="box" x="60" y="225" width="165" height="52" fill="var(--app)"/><text x="142" y="257">Write API</text><rect class="box" x="285" y="225" width="165" height="52" fill="var(--app)"/><text x="367" y="257">Read API</text><rect class="box" x="510" y="225" width="165" height="52" fill="var(--app)"/><text x="592" y="257">Analytics</text><path class="flow" d="M590 168v35H142v22"/><path class="flow" d="M590 168v57H367"/><path class="flow" d="M590 168v35H592v22"/>
<rect class="box" x="40" y="375" width="180" height="52" fill="var(--cache)"/><text x="130" y="407">Memory cache</text><rect class="box" x="260" y="375" width="180" height="52" fill="var(--data)"/><text x="350" y="407">SQL write master</text><rect class="box" x="480" y="375" width="180" height="52" fill="var(--data)"/><text x="570" y="407">SQL read replicas</text><rect class="box" x="700" y="375" width="180" height="52" fill="var(--data)"/><text x="790" y="407">Object store</text><rect class="box" x="900" y="375" width="160" height="52" fill="var(--data)"/><text x="980" y="407">Warehouse</text><path class="flow" d="M142 277v55H130v43"/><path class="flow" d="M142 277v55h208v43"/><path class="flow" d="M367 277v98"/><path class="flow" d="M367 277v55h203v43"/><path class="flow" d="M367 277v55h423v43"/><path class="flow" d="M592 277v55h388v43"/></g><text x="24" y="500" font-size="15" fill="var(--ink)">The CDN serves static content; caches and replicas protect the read path.</text></svg>
