<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">AWS scaling journey</title><desc id="desc">The service evolves from client and DNS through CDN, load balancer, web servers, queues, memory cache, SQL master and replicas, NoSQL, and object storage.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--edge:#e0e7ff;--app:#dbeafe;--queue:#bae6fd;--cache:#a5f3fc;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--edge:#312e81;--app:#1e3a5f;--queue:#164e63;--cache:#155e75;--data:#312e81}}text{font:16px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2.2;marker-end:url(#a)}.label{font-size:13px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect width="1100" height="620" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="32" y="35" width="150" height="48" fill="var(--edge)"/><text x="107" y="65">Client</text><rect class="box" x="210" y="35" width="150" height="48" fill="var(--edge)"/><text x="285" y="65">DNS</text><rect class="box" x="388" y="35" width="150" height="48" fill="var(--edge)"/><text x="463" y="65">CDN</text><rect class="box" x="566" y="35" width="170" height="48" fill="var(--app)"/><text x="651" y="65">Load balancer</text><path class="flow" d="M182 59h28"/><path class="flow" d="M360 59h28"/><path class="flow" d="M538 59h28"/>
<rect class="box" x="566" y="145" width="170" height="48" fill="var(--app)"/><text x="651" y="175">Web servers</text><rect class="box" x="788" y="145" width="170" height="48" fill="var(--app)"/><text x="873" y="175">Autoscaling</text><path class="flow" d="M651 83v62"/>
<rect class="box" x="80" y="300" width="170" height="48" fill="var(--app)"/><text x="165" y="330">Worker service</text><rect class="box" x="290" y="300" width="170" height="48" fill="var(--queue)"/><text x="375" y="330">Queue</text><rect class="box" x="500" y="300" width="170" height="48" fill="var(--app)"/><text x="585" y="330">Read and write APIs</text><rect class="box" x="710" y="300" width="170" height="48" fill="var(--cache)"/><text x="795" y="330">Memory cache</text><path class="flow" d="M651 193v62H585v45"/><path class="flow" d="M585 348H375"/><path class="flow" d="M290 324H250"/><path class="flow" d="M670 324h40"/>
<rect class="box" x="90" y="470" width="180" height="58" fill="var(--data)"/><text x="180" y="505">SQL master</text><rect class="box" x="320" y="470" width="180" height="58" fill="var(--data)"/><text x="410" y="505">SQL read replicas</text><rect class="box" x="550" y="470" width="180" height="58" fill="var(--data)"/><text x="640" y="505">NoSQL store</text><rect class="box" x="780" y="470" width="180" height="58" fill="var(--data)"/><text x="870" y="505">Object store</text><path class="flow" d="M585 348v82H180v40"/><path class="flow" d="M585 348v82H410v40"/><path class="flow" d="M585 348v122"/><path class="flow" d="M585 348v82h285v40"/></g><text class="label" x="24" y="575" fill="var(--ink)">Each stage addresses a measured bottleneck: static content, web concurrency, hot reads, then database capacity.</text></svg>
