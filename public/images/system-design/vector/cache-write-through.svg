<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Write-through cache flow</title>
  <desc id="desc">The application sends a write to the cache. The cache synchronously writes the database, then acknowledges the application.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="var(--blue)"/></marker>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--card:#ffffff;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--blue:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--blue:#60a5fa}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}</style>
  </defs>
  <rect x="12" y="12" width="736" height="276" rx="16" fill="var(--bg)" stroke="var(--border)"/>
  <text x="36" y="48" font-size="18" font-weight="700">Write-through</text>
  <g fill="var(--card)" stroke="var(--blue)" stroke-width="2"><rect x="36" y="112" width="148" height="64" rx="10"/><rect x="282" y="112" width="148" height="64" rx="10"/><rect x="528" y="112" width="148" height="64" rx="10"/></g>
  <g font-size="16" text-anchor="middle"><text x="110" y="150">Application</text><text x="356" y="150">Cache</text><text x="602" y="150">Database</text></g>
  <g fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#a)"><path d="M184 144h96"/><path d="M430 144h96"/><path d="M356 112V76H110v36"/><path d="M602 112V76H356v36"/></g>
  <g font-size="12" fill="var(--muted)"><text x="206" y="136">1. write value</text><text x="444" y="136">2. sync write</text><text x="196" y="68">3. acknowledge</text><text x="536" y="68">after database success</text></g>
</svg>
