<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">CAP theorem during a network partition</title>
  <desc id="desc">Two replicas lose communication across a partition. The system can preserve consistency with partition tolerance by rejecting or delaying a request, or preserve availability with partition tolerance by serving a reachable value that may be stale.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--blue)"/></marker><style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--blue:#2563eb;--blue-card:#eff6ff;--blue-node:#bfdbfe;--green:#16a34a;--green-card:#f0fdf4;--green-node:#bbf7d0;--yellow:#d97706;--yellow-bg:#fef3c7}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--blue:#60a5fa;--blue-card:#172554;--blue-node:#1e4b73;--green:#4ade80;--green-card:#14532d;--green-node:#166534;--yellow:#fbbf24;--yellow-bg:#713f12}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.label{font-size:17px;font-weight:700}.small{font-size:14px;fill:var(--muted)}</style></defs>
  <rect width="1000" height="430" rx="18" fill="var(--bg)" stroke="var(--border)"/><text x="500" y="36" text-anchor="middle" class="label">CAP describes the choice made while communication is broken</text>
  <rect x="50" y="80" width="360" height="285" rx="14" fill="var(--blue-card)" stroke="var(--blue)" stroke-width="2"/><text x="230" y="112" text-anchor="middle" class="label">CP</text><text x="230" y="136" text-anchor="middle" class="small">consistency + partition tolerance</text>
  <rect x="590" y="80" width="360" height="285" rx="14" fill="var(--green-card)" stroke="var(--green)" stroke-width="2"/><text x="770" y="112" text-anchor="middle" class="label">AP</text><text x="770" y="136" text-anchor="middle" class="small">availability + partition tolerance</text>
  <g stroke="var(--blue)" stroke-width="2"><rect x="95" y="180" width="100" height="62" rx="10" fill="var(--blue-node)"/><rect x="300" y="180" width="100" height="62" rx="10" fill="var(--blue-node)"/><path d="M195 210H240" stroke-dasharray="7 5"/><path d="M255 210H300" stroke-dasharray="7 5"/></g>
  <g stroke="var(--green)" stroke-width="2"><rect x="635" y="180" width="100" height="62" rx="10" fill="var(--green-node)"/><rect x="840" y="180" width="100" height="62" rx="10" fill="var(--green-node)"/><path d="M735 210H840"/></g>
  <g text-anchor="middle"><text x="145" y="216" class="label">Replica 1</text><text x="350" y="216" class="label">Replica 2</text><text x="685" y="216" class="label">Replica 1</text><text x="890" y="216" class="label">Replica 2</text></g>
  <text x="247" y="202" text-anchor="middle" class="small">partition</text><text x="247" y="226" text-anchor="middle" class="small">no messages</text>
  <g text-anchor="middle"><text x="230" y="285" class="small">Wait for the required replica.</text><text x="230" y="308" class="small">Return an error if it cannot respond.</text><text x="770" y="285" class="small">Serve from a reachable replica.</text><text x="770" y="308" class="small">Reconcile after communication returns.</text></g>
  <rect x="370" y="382" width="260" height="30" rx="15" fill="var(--yellow-bg)" stroke="var(--yellow)"/><text x="500" y="402" text-anchor="middle" class="small">P: messages may be lost or delayed</text>
</svg>
