<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Content delivery network with edge locations</title>
  <desc id="desc">An origin server supplies content to edge locations around the world. Users request content from a nearby edge, which serves a cached response or fetches a miss from the origin.</desc>
  <defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--blue)"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--green)"/></marker><style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--blue:#2563eb;--origin-bg:#eff6ff;--origin-node:#bfdbfe;--edge-node:#dbeafe;--green:#15803d;--yellow:#d97706;--yellow-bg:#fef3c7}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--blue:#60a5fa;--origin-bg:#172554;--origin-node:#1e4b73;--edge-node:#1e3a5f;--green:#4ade80;--yellow:#fbbf24;--yellow-bg:#713f12}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--muted)}</style></defs>
  <rect width="1100" height="500" rx="18" fill="var(--bg)" stroke="var(--border)"/><text x="550" y="36" text-anchor="middle" class="label">Users reach a nearby edge location</text>
  <circle cx="550" cy="245" r="84" fill="var(--origin-bg)" stroke="var(--blue)" stroke-width="3"/><rect x="510" y="205" width="80" height="80" rx="10" fill="var(--origin-node)" stroke="var(--blue)" stroke-width="2"/><text x="550" y="239" text-anchor="middle" class="label">Origin</text><text x="550" y="260" text-anchor="middle" class="small">source content</text>
  <g fill="var(--edge-node)" stroke="var(--blue)" stroke-width="2"><circle cx="250" cy="120" r="42"/><circle cx="850" cy="120" r="42"/><circle cx="180" cy="345" r="42"/><circle cx="920" cy="345" r="42"/><circle cx="550" cy="430" r="42"/></g>
  <g text-anchor="middle"><text x="250" y="125" class="label">Edge</text><text x="850" y="125" class="label">Edge</text><text x="180" y="350" class="label">Edge</text><text x="920" y="350" class="label">Edge</text><text x="550" y="435" class="label">Edge</text></g>
  <g fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="7 5"><path d="M500 205 278 143"/><path d="M600 205 822 143"/><path d="M490 280 220 330"/><path d="M610 280 880 330"/><path d="M550 329V385"/></g>
  <g fill="none" stroke="var(--green)" stroke-width="2" marker-end="url(#green)"><path d="M208 120H88"/><path d="M892 120H1012"/><path d="M138 345H48"/><path d="M962 345H1052"/></g>
  <g class="small" text-anchor="middle"><text x="148" y="102">user</text><text x="952" y="102">user</text><text x="90" y="328">user</text><text x="1010" y="328">user</text></g>
  <rect x="350" y="68" width="400" height="34" rx="17" fill="var(--yellow-bg)" stroke="var(--yellow)"/><text x="550" y="90" text-anchor="middle" class="small">cache miss: edge fetches from origin</text>
  <text x="550" y="478" text-anchor="middle" class="small">cache hit: edge returns the stored response without contacting origin</text>
</svg>
