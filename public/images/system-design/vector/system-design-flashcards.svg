<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">System design flashcards</title><desc id="desc">An original illustration of a small stack of system design study cards with a diagram symbol.</desc><style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--blue:#2563eb;--card:#dbeafe;--line:#53657d}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--blue:#93c5fd;--card:#1e3a5f;--line:#9fb3cc}}text{font:26px system-ui,sans-serif;fill:var(--ink)}.card{fill:var(--card);stroke:var(--line);stroke-width:3;rx:14}.node{fill:var(--blue)}.wire{stroke:var(--blue);stroke-width:8;stroke-linecap:round}</style><rect width="720" height="420" fill="var(--bg)"/><g transform="translate(140 44) rotate(-7 220 150)"><rect class="card" x="48" y="38" width="430" height="270"/><rect class="card" x="24" y="20" width="430" height="270"/><rect class="card" width="430" height="270"/><text x="215" y="70" text-anchor="middle" font-weight="700">SYSTEM DESIGN</text><text x="215" y="104" text-anchor="middle" font-size="18">Architecture notes</text><path class="wire" d="M100 190h230M215 140v100"/><circle class="node" cx="100" cy="190" r="14"/><circle class="node" cx="330" cy="190" r="14"/><circle class="node" cx="215" cy="140" r="14"/><circle class="node" cx="215" cy="240" r="14"/></g></svg>
