<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Asynchronous processing with a queue</title>
  <desc id="desc">A client sends a job to an API. The API returns 202 Accepted with a job ID and publishes the job to a queue. A worker consumes the job and writes the result to a store, while the client later reads status.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--blue)"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--green)"/></marker><style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--blue:#2563eb;--blue-light:#dbeafe;--blue-fill:#bfdbfe;--yellow:#d97706;--yellow-bg:#fef3c7;--purple:#7c3aed;--purple-bg:#ede9fe;--green:#16a34a;--green-bg:#dcfce7}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--blue:#60a5fa;--blue-light:#1e3a5f;--blue-fill:#1e4b73;--yellow:#fbbf24;--yellow-bg:#713f12;--purple:#a78bfa;--purple-bg:#3b0764;--green:#4ade80;--green-bg:#14532d}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:var(--muted)}</style></defs>
  <rect width="1000" height="360" rx="18" fill="var(--bg)" stroke="var(--border)"/><text x="500" y="34" text-anchor="middle" class="label">Move slow work out of the request path</text>
  <g stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"><path d="M145 150H220"/><path d="M335 150H410"/><path d="M525 150H600"/><path d="M715 150H790"/></g>
  <g stroke-width="2"><ellipse cx="90" cy="150" rx="55" ry="32" fill="var(--blue-light)" stroke="var(--blue)"/><rect x="220" y="112" width="115" height="76" rx="10" fill="var(--blue-fill)" stroke="var(--blue)"/><rect x="410" y="112" width="115" height="76" rx="10" fill="var(--yellow-bg)" stroke="var(--yellow)"/><rect x="600" y="112" width="115" height="76" rx="10" fill="var(--purple-bg)" stroke="var(--purple)"/><rect x="790" y="112" width="115" height="76" rx="10" fill="var(--green-bg)" stroke="var(--green)"/></g>
  <g text-anchor="middle"><text x="90" y="156" class="label">Client</text><text x="277" y="156" class="label">API</text><text x="467" y="156" class="label">Queue</text><text x="657" y="156" class="label">Worker</text><text x="847" y="156" class="label">Store</text></g>
  <path d="M277 188V258H90V188" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="182" y="251" text-anchor="middle" class="small">later: GET status</text>
  <path d="M277 112V70H90V118" fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/><text x="182" y="62" text-anchor="middle" class="small">202 Accepted + job ID</text>
  <path d="M657 188V260" stroke="var(--green)" stroke-width="2" marker-end="url(#green)"/><text x="657" y="286" text-anchor="middle" class="small">process and write result</text>
  <path d="M425 210H700" stroke="var(--yellow)" stroke-width="2" stroke-dasharray="5 5"/><text x="560" y="232" text-anchor="middle" class="small">queue depth applies back pressure</text>
</svg>
