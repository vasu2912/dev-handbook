<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="title desc">
  <title id="title">Graph database model</title>
  <desc id="desc">Three graph nodes represent Alice, Bob, and a chess group. Directed relationships connect people to the group and to each other.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="var(--blue)"/></marker>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--blue:#2563eb;--alice-bg:#dbeafe;--bob-bg:#e0f2fe;--bob-stroke:#0284c7;--group-bg:#ecfeff;--group-stroke:#0f766e}@media(prefers-color-scheme:dark){:root{--bg:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--blue:#60a5fa;--alice-bg:#1e3a5f;--bob-bg:#164e63;--bob-stroke:#38bdf8;--group-bg:#134e4a;--group-stroke:#5eead4}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}</style>
  </defs>
  <rect x="12" y="12" width="836" height="316" rx="16" fill="var(--bg)" stroke="var(--border)"/>
  <text x="36" y="46" font-size="18" font-weight="700">Graph database</text>
  <text x="36" y="70" font-size="12" fill="var(--muted)">Nodes store entities. Edges store named relationships.</text>
  <g fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#a)"><path d="M282 164 560 126"/><path d="M282 188 560 218"/><path d="M668 153 666 194"/><path d="M590 194 292 207"/><path d="M560 120 282 154"/></g>
  <g font-size="12" fill="var(--muted)"><text x="403" y="132">knows</text><text x="407" y="226">member of</text><text x="686" y="178">has members</text><text x="420" y="190">member of</text></g>
  <circle cx="184" cy="180" r="98" fill="var(--alice-bg)" stroke="var(--blue)" stroke-width="3"/>
  <circle cx="658" cy="112" r="60" fill="var(--bob-bg)" stroke="var(--bob-stroke)" stroke-width="3"/>
  <circle cx="658" cy="240" r="60" fill="var(--group-bg)" stroke="var(--group-stroke)" stroke-width="3"/>
  <g text-anchor="middle"><text x="184" y="170" font-size="17" font-weight="650">Alice</text><text x="184" y="192" font-size="13">id: 1</text><text x="658" y="106" font-size="16" font-weight="650">Bob</text><text x="658" y="125" font-size="12">id: 2</text><text x="658" y="234" font-size="16" font-weight="650">Chess group</text><text x="658" y="253" font-size="12">id: 3</text></g>
</svg>
