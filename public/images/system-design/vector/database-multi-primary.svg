<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Multi-primary database replication</title>
  <desc id="desc">Two primary databases accept reads and writes. They replicate changes in both directions, so conflict handling is required.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="var(--blue)"/></marker>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="var(--teal)"/></marker>
    <style>:root{color-scheme:light dark;--bg:#f8fafc;--card:#ffffff;--border:#cbd5e1;--ink:#0f172a;--muted:#475569;--blue:#2563eb;--blue-bg:#dbeafe;--teal:#0f766e;--muted-line:#64748b}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--border:#475569;--ink:#e2e8f0;--muted:#94a3b8;--blue:#60a5fa;--blue-bg:#1e3a5f;--teal:#5eead4;--muted-line:#94a3b8}}text{font-family:'Inter',system-ui,sans-serif;fill:var(--ink)}</style>
  </defs>
  <rect x="12" y="12" width="776" height="276" rx="16" fill="var(--bg)" stroke="var(--border)"/>
  <text x="36" y="46" font-size="18" font-weight="700">Multi-primary replication</text>
  <g fill="var(--card)" stroke="var(--muted-line)" stroke-width="2"><rect x="44" y="106" width="132" height="54" rx="10"/><rect x="44" y="210" width="132" height="54" rx="10"/></g>
  <g font-size="14" text-anchor="middle"><text x="110" y="139">Client A</text><text x="110" y="243">Client B</text></g>
  <g fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="2"><rect x="314" y="82" width="160" height="68" rx="10"/><rect x="314" y="192" width="160" height="68" rx="10"/></g>
  <g font-size="15" text-anchor="middle"><text x="394" y="122">Primary A</text><text x="394" y="232">Primary B</text></g>
  <g fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#a)"><path d="M176 133h138"/><path d="M176 237h138"/><path d="M474 112h156"/><path d="M630 230H474"/></g>
  <path d="M394 150v42" fill="none" stroke="var(--teal)" stroke-width="2" marker-end="url(#m)"/>
  <path d="M410 192v-42" fill="none" stroke="var(--teal)" stroke-width="2" marker-end="url(#m)"/>
  <g font-size="12" fill="var(--muted)"><text x="212" y="124">reads/writes</text><text x="212" y="228">reads/writes</text><text x="500" y="103">replicate</text><text x="500" y="221">replicate</text><text x="425" y="180">conflicts</text></g>
</svg>
