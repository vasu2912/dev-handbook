<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Social graph, high-level design</title><desc id="desc">A client sends a search request through a web server to a search API and user graph service. The graph service uses lookup and person servers.</desc>
  <style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--client:#d9f99d;--api:#dbeafe;--svc:#bfdbfe;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--client:#365314;--api:#1e3a5f;--svc:#1e4b73;--data:#312e81}}text{font:17px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs>
  <rect width="960" height="540" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="395" y="20" width="170" height="50" fill="var(--client)"/><text x="480" y="52">Client</text><rect class="box" x="395" y="100" width="170" height="50" fill="var(--api)"/><text x="480" y="132">Web server</text><path class="flow" d="M480 70v30"/>
    <rect class="box" x="90" y="230" width="170" height="58" fill="var(--api)"/><text x="175" y="265">Search API</text><rect class="box" x="315" y="230" width="190" height="58" fill="var(--svc)"/><text x="410" y="265">User graph service</text><rect class="box" x="650" y="230" width="190" height="58" fill="var(--svc)"/><text x="745" y="265">Lookup service</text><path class="flow" d="M480 150v44H175v36"/><path class="flow" d="M480 150v80"/><path class="flow" d="M505 259h145"/>
    <rect class="box" x="170" y="390" width="200" height="62" fill="var(--data)"/><text x="270" y="427">Person server A</text><rect class="box" x="440" y="390" width="200" height="62" fill="var(--data)"/><text x="540" y="427">Person server B</text><rect class="box" x="710" y="390" width="150" height="62" fill="var(--data)"/><text x="785" y="427">Person server C</text><path class="flow" d="M410 288v54H270v48"/><path class="flow" d="M410 288v54h130v48"/><path class="flow" d="M745 288v54H785v48"/>
  </g><text x="24" y="520" font-size="15" fill="var(--ink)">The graph service runs breadth-first search while lookup routes IDs to graph shards.</text>
</svg>
