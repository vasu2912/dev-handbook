<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Web crawler, high-level design</title><desc id="desc">A client reaches a web server, then query and crawler paths use reverse index, document, and queue services backed by NoSQL.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--client:#d9f99d;--api:#dbeafe;--svc:#bfdbfe;--queue:#bae6fd;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--client:#365314;--api:#1e3a5f;--svc:#1e4b73;--queue:#164e63;--data:#312e81}}text{font:16px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs>
<rect width="960" height="540" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="395" y="20" width="170" height="50" fill="var(--client)"/><text x="480" y="52">Client</text><rect class="box" x="395" y="100" width="170" height="50" fill="var(--api)"/><text x="480" y="132">Web server</text><path class="flow" d="M480 70v30"/>
<rect class="box" x="55" y="230" width="160" height="58" fill="var(--api)"/><text x="135" y="265">Query API</text><rect class="box" x="280" y="230" width="190" height="58" fill="var(--svc)"/><text x="375" y="265">Reverse index</text><rect class="box" x="505" y="230" width="180" height="58" fill="var(--queue)"/><text x="595" y="265">Crawl queue</text><rect class="box" x="720" y="230" width="170" height="58" fill="var(--svc)"/><text x="805" y="265">Crawler service</text><path class="flow" d="M480 150v45H135v35"/><path class="flow" d="M480 150v45H375v35"/><path class="flow" d="M480 150v45h115v35"/><path class="flow" d="M480 150v45h325v35"/>
<rect class="box" x="260" y="390" width="190" height="62" fill="var(--svc)"/><text x="355" y="427">Document service</text><rect class="box" x="535" y="390" width="190" height="62" fill="var(--data)"/><text x="630" y="427">NoSQL store</text><path class="flow" d="M375 288v52H355v50"/><path class="flow" d="M595 288v52H630v50"/><path class="flow" d="M805 288v52H630v50"/></g><text x="24" y="520" font-size="15" fill="var(--ink)">The crawler queues fetches and writes document metadata plus a reverse index.</text></svg>
