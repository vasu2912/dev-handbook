<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Personal finance service, high-level design</title><desc id="desc">A client reaches a web server and account, transaction, category, and notification services. A queue, SQL database, and object store support the flow.</desc>
<style>:root{color-scheme:light dark;--bg:#f8fafc;--ink:#172033;--line:#53657d;--client:#d9f99d;--api:#dbeafe;--svc:#bfdbfe;--queue:#bae6fd;--data:#c7d2fe}@media(prefers-color-scheme:dark){:root{--bg:#111827;--ink:#e5edf8;--line:#9fb3cc;--client:#365314;--api:#1e3a5f;--svc:#1e4b73;--queue:#164e63;--data:#312e81}}text{font:15px system-ui,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:2;rx:10}.flow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs>
<rect width="960" height="540" fill="var(--bg)"/><g text-anchor="middle"><rect class="box" x="395" y="18" width="170" height="48" fill="var(--client)"/><text x="480" y="49">Client</text><rect class="box" x="395" y="92" width="170" height="48" fill="var(--api)"/><text x="480" y="123">Web server</text><path class="flow" d="M480 66v26"/>
<rect class="box" x="60" y="195" width="160" height="54" fill="var(--svc)"/><text x="140" y="228">Accounts API</text><rect class="box" x="250" y="195" width="160" height="54" fill="var(--svc)"/><text x="330" y="228">Category service</text><rect class="box" x="440" y="195" width="160" height="54" fill="var(--queue)"/><text x="520" y="228">Queue</text><rect class="box" x="630" y="195" width="160" height="54" fill="var(--svc)"/><text x="710" y="228">Transactions</text><path class="flow" d="M480 140V165H140v30"/><path class="flow" d="M480 140V165H330v30"/><path class="flow" d="M480 140v55"/><path class="flow" d="M480 140V165H710v30"/>
<rect class="box" x="195" y="365" width="190" height="60" fill="var(--data)"/><text x="290" y="400">SQL database</text><rect class="box" x="470" y="365" width="190" height="60" fill="var(--data)"/><text x="565" y="400">Object store</text><rect class="box" x="745" y="365" width="160" height="60" fill="var(--svc)"/><text x="825" y="400">Notifications</text><path class="flow" d="M140 249v68h150v48"/><path class="flow" d="M710 249v68H565v48"/><path class="flow" d="M520 249v68H565v48"/><path class="flow" d="M330 249v68H290v48"/><path class="flow" d="M710 249v68h115v48"/></g><text x="24" y="505" font-size="14" fill="var(--ink)">Account jobs run asynchronously; raw transaction logs stay in object storage.</text></svg>
