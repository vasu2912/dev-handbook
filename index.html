<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/site.css" />
    <link rel="stylesheet" href="/src/styles/learning.css" />
    <link rel="stylesheet" href="/src/styles/home.css" />
    <link rel="stylesheet" href="/src/figures/anatomy/figure.css" />
    <!--page-head-->
    <script>
      try {
        const theme = localStorage.getItem("handbook-theme");
        document.documentElement.dataset.theme =
          theme === "dark" || theme === "light"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
      // Keep in step with src/lib/preferences.ts.
      try {
        const size = localStorage.getItem("handbook-type-size");
        if (["15px", "17px", "19px"].includes(size))
          document.documentElement.style.setProperty("--reading-size", size);
      } catch {
        /* Use the default reading size. */
      }
    </script>
  </head>
  <body>
    <div id="root"><!--page-app--></div>
    <script id="page-data" type="application/json">
      <!--page-data-->
    </script>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
